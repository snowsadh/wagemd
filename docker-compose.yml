# Optional local TimescaleDB for development; Tiger Data Cloud uses TIGER_DATABASE_URL.
services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wage_md
      POSTGRES_USER: wage
      POSTGRES_PASSWORD: wage
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wage -d wage_md"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  timescale-data:
