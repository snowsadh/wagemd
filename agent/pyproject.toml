[project]
name = "wage-md-agent"
version = "0.0.0"
description = "WAGE.md backend — three autonomous agents over DOL salary disclosures."
requires-python = ">=3.11"
dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Data
    "pandas>=2.2",
    "openpyxl>=3.1",          # LCA .xlsx parsing
    "psycopg[binary]>=3.2",
    # LLM
    "openai>=2.0",
    # Utilities
    "tenacity>=9.0",          # retries on flaky source/API calls
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
